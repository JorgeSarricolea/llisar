<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@500;600&display=swap');
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 100%; height: 100%; }
      body {
        display: grid;
        place-items: center;
        background: #0b1220;
        color: #f4f1ea;
        font-family: Figtree, system-ui, sans-serif;
        text-align: center;
        padding: 8%;
      }
      .card {
        max-width: 18ch;
      }
      h1 {
        font-family: Fraunces, Georgia, serif;
        font-weight: 600;
        font-size: clamp(2.4rem, 7vw, 4.2rem);
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin-bottom: 0.6em;
      }
      .phone {
        font-size: clamp(1.2rem, 3.2vw, 1.85rem);
        font-weight: 600;
        color: #e8a35a;
        margin-bottom: 0.45em;
      }
      .hint {
        font-size: clamp(0.95rem, 2.2vw, 1.2rem);
        opacity: 0.78;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Habla con Llisar</h1>
      <p class="phone">+52 999 187 2848</p>
      <p class="hint">WhatsApp · llisar.com</p>
    </div>
  </body>
</html>
