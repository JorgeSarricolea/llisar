<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta
      name="description"
      content="La página que buscas no existe en Llisar."
    />
    <title>Página no encontrada | Llisar</title>
    <link rel="canonical" href="https://llisar.com/404.html" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        --ink: #142033;
        --muted: #5b6575;
        --paper: #f4f1ea;
        --accent: #c47a3a;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: Figtree, system-ui, sans-serif;
        background: var(--paper);
        color: var(--ink);
      }
      main {
        max-width: 36rem;
      }
      p.kicker {
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      h1 {
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: -0.03em;
        line-height: 1.1;
        margin: 0.5rem 0 1rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        margin-top: 1.25rem;
        padding: 0.85rem 1.25rem;
        border-radius: 999px;
        background: var(--accent);
        color: #1a120c;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">404</p>
      <h1>No encontramos esa página.</h1>
      <p>El enlace puede estar mal escrito o la página ya no existe.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
