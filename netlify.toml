[build]
  command = "npm run build"
  publish = "dist"

# Explicit SPA shells only — avoids soft-404s for unknown URLs (Google JS SEO).
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# SPA fallbacks only when no prerendered HTML exists (seo-build writes
# /nosotros/index.html, /nosotros.html, /blog/<slug>.html, etc.).
[[redirects]]
  from = "/nosotros"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contacto"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/index.html"
  status = 200

# Netlify Free injects "Powered by Netlify" via /.netlify/scripts/hud (srcdoc iframe).
# CSP without script-src 'unsafe-inline' / with frame-src 'none' blocks that badge
# for every visitor (docs.netlify.com/manage/projects/powered-by-netlify-badge/).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; form-action 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
